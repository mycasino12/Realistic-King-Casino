
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Casino - Roulette</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #151c30;
    padding: 18px;
    border-bottom: 2px solid gold;
}

.logo {
    color: #f4c542;
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 20px;
}

.box {
    background: #151c30;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #343d59;
    margin-bottom: 20px;
}

.wheel {
    font-size: 100px;
    margin: 25px;
    transition: transform 1s;
}

select {
    padding: 12px;
    border-radius: 8px;
    border: 0;
    margin: 8px;
    width: 90%;
    max-width: 300px;
}

button {
    background: #f4c542;
    color: #111;
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
}

button:hover {
    background: #ffe17b;
}

#result {
    font-size: 20px;
    font-weight: bold;
    margin: 20px;
    color: gold;
    min-height: 30px;
}

a {
    color: #f4c542;
    margin: 10px;
}

.spin-animation {
    animation: spin 1.5s ease-out;
}

@keyframes spin {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(1440deg);
    }
}
</style>
</head>

<body>

<header>
<div class="logo">👑 KING CASINO - ROULETTE</div>
</header>

<div class="container">

<div class="box">
<h2>🎡 Roulette Table</h2>

<div class="wheel" id="wheel">🎡</div>

<p>Choose a colour to explore the roulette .</p>

<select id="choice">
    <option value="red">Red</option>
    <option value="black">Black</option>
    <option value="green">Green (0)</option>
</select>

<br>

<button onclick="spin()">SPIN ROULETTE</button>

<div id="result">Click the button to spin.</div>

</div>

<div class="box">

<button onclick="location.href='dashboard.html'">
DASHBOARD
</button>

<button onclick="location.href='games.html'">
GAMES LOBBY
</button>

</div>

</div>

<script>

function spin() {

    const wheel = document.getElementById("wheel");
    const result = document.getElementById("result");
    const choice = document.getElementById("choice").value;

    wheel.classList.remove("spin-animation");

    void wheel.offsetWidth;

    wheel.classList.add("spin-animation");

    result.textContent = "The wheel is spinning...";

    setTimeout(function() {

        const number = Math.floor(Math.random() * 37);

        let colour;

        if (number === 0) {
            colour = "green";
        } else {

            const redNumbers = [
                1,3,5,7,9,12,14,16,18,
                19,21,23,25,27,30,32,34,36
            ];

            colour = redNumbers.includes(number)
                ? "red"
                : "black";
        }

        if (colour === choice) {

            result.textContent =
                "🎉 Your chosen colour matched! Number " +
                number + " landed " + colour.toUpperCase() + ".";

        } else {

            result.textContent =
                "Number " + number +
                " landed " + colour.toUpperCase() +
                ". Try another spin!";
        }

    }, 1500);
}

</script>

</body>
</html>
